topics:
    - name: aiops
      description: 'AIOps intelligent operations'
      actions:
      subtopics:
        - name: alarm
          description: 'Alarm query, acknowledge, unacknowledge and clear'
          actions:
            - name: list
              description: 'Query alarm info'
              func: alarm_list
              params: [alarm_id, severity, mo_dn, alarm_group_id, dc_id, product_name, alarm_name, occur_utc_start, occur_utc_end, fields, page_no, page_size, cleared, size, iterator, include_history]
            - name: ack
              description: 'Acknowledge alarm'
              func: alarm_ack
              params: [csns]
            - name: unack
              description: 'Un-acknowledge alarm'
              func: alarm_unack
              params: [csns]
            - name: clear
              description: 'Clear alarm'
              func: alarm_clear
              params: [csns]
        - name: diagnose_task
          description: 'Intelligent diagnosis task create and status query'
          actions:
            - name: create
              description: 'Create intelligent analysis task'
              func: diagnose_task_create
              params: [object_ids, object_type, begin_time, end_time, analysis_types]
            - name: status
              description: 'Query performance diagnosis task status'
              func: diagnose_task_status
              params: [task_id]
        - name: performance
          description: 'Historical performance query, indicator query and collection'
          actions:
            - name: create_collect_task
              description: 'Create performance file collection task'
              func: performance_create_collect_task
              params: [begin_time, end_time, object_type_id, object_ids, indicator_ids]
            - name: download_collect_result
              description: 'Download performance file'
              func: performance_download_collect_result
              params: [task_id, save_to]
            - name: query
              description: 'Query historical performance data'
              func: performance_query
              params: [obj_type_id, indicator_ids, obj_ids, obj_type, indicators, ext_dimensions, interval, range, begin_time, end_time]
            - name: show_indicators
              description: 'Show monitoring indicator details'
              func: performance_show_indicators
              params: [indicators]
            - name: list_indicators
              description: 'List monitoring indicators supported by the monitoring object type'
              func: performance_list_indicators
              params: [obj_type_id]
            - name: list_object_types
              description: 'Get all monitoring object types'
              func: performance_list_object_types
              params: [filter]
        - name: check_result
          description: 'Policy check result list and detail query'
          actions:
            - name: list
              description: 'Query check policy abnormal check result list'
              func: check_result_list
              params: [object_name, level, object_ids, object_native_id, object_type, policy_id, policy_name, policy_types, cause, alarm_type, first_occur_time, last_occur_time, page_no, page_size, sort_key, sort_dir]
            - name: show
              description: 'Query check policy abnormal check result details'
              func: check_result_show
              params: [check_result_id]
        - name: check_policy
          description: 'Check policy query, execute, enable, disable and delete'
          actions:
            - name: list
              description: 'Query check policy list'
              func: check_policy_list
              params: [policy_name, exact_query, status, policy_type, policy_source, alarm_type, object_type, page_no, page_size, sort_key, sort_dir, administrative_status, policy_category, object_category]
            - name: execute
              description: 'Execute check policy'
              func: check_policy_execute
              params: [policy_id]
            - name: enable
              description: 'Enable check policy'
              func: check_policy_enable
              params: [policy_id]
            - name: disable
              description: 'Disable check policy'
              func: check_policy_disable
              params: [policy_id]
            - name: delete
              description: 'Delete check policy'
              func: check_policy_delete
              params: [policy_id]
        - name: topology
          description: 'SAN path, LUN, VM and topology graph query'
          actions:
            - name: query_san_path
              description: 'Query SAN path topology structure'
              func: topology_query_san_path
              params: [entry_objects, san_type]
            - name: query_luns
              description: 'Query topology LUN list'
              func: topology_query_luns
              params: [entry_objects, storage_pool_id, lun_name, san_type, page_size, page_no]
            - name: query_vms
              description: 'Query topology virtual machines and virtual disk list, or query BMS physical disk list'
              func: topology_query_vms
              params: [entry_objects, host_id, vm_name, page_size, page_no]
            - name: query_graph_path
              description: 'Query topology graph info'
              func: topology_query_graph_path
              params: [entry_res_type, entry_res_id, type, filter]
        - name: health
          description: 'Object health score and deduction detail query'
          actions:
            - name: query_data
              description: 'Query health related data'
              func: health_query_data
              params: [type, object_id, begin_time, end_time, object_type, indicator]
            - name: show_score
              description: 'Query object health score'
              func: health_show_score
              params: [object_type, object_name, object_ids, page_no, page_size, sort_key, sort_dir]
            - name: show_detail
              description: 'Query deduction details of health dimensions'
              func: health_show_detail
              params: [object_id, object_type, health_dimension]
    - name: backup
      description: 'Backup management operations'
      actions:
      subtopics:
        - name: cluster
          description: 'Backup cluster list, capacity and tenant quota query'
          actions:
            - name: list
              description: 'Query backup cluster list'
              func: cluster_list
              params: [page_no, page_size]
            - name: capacity
              description: 'Query backup cluster capacity'
              func: cluster_capacity
              params: [cluster_id]
            - name: quota
              description: 'Query backup cluster tenant quota list'
              func: cluster_quota
              params: [cluster_id, page_no, page_size]
    - name: fcswitch
      description: 'FC Switch related operations'
      actions:
          - name: list
            description: 'Batch query switches'
            func: list
            params: [name, page_no, page_size]
          - name: sync
            description: 'Sync specified switch'
            func: sync
            params: [switch_id]
      subtopics:
        - name: port
          description: 'FC switch port query'
          actions:
            - name: list
              description: 'Batch query switch ports'
              func: port_list
              params: [switch_id, port_name, page_no, page_size]
        - name: controller
          description: 'FC switch controller query'
          actions:
            - name: list
              description: 'Batch query switch control processors'
              func: controller_list
              params: [switch_id, page_no, page_size]
        - name: fabric
          description: 'Fabric query and configuration file backup'
          actions:
            - name: list
              description: 'Batch query fabrics'
              func: fabric_list
              params: [name, page_no, page_size]
            - name: show_ports
              description: 'Query port list of specified fabric'
              func: fabric_show_ports
              params: [fabric_id, page_no, page_size]
            - name: backup
              description: 'Execute fabric configuration file backup'
              func: fabric_backup
              params: [fabric_id, backup_server_id, backup_type]
        - name: vsan
          description: 'VSAN list query'
          actions:
            - name: list
              description: 'Query VSAN list'
              func: vsan_list
              params: [page_no, page_size]
        - name: zone
          description: 'Zone query, create, modify, delete and member query'
          actions:
            - name: list
              description: 'Batch query zone'
              func: zone_list
              params: [zone_name, page_no, page_size]
            - name: create
              description: 'Create zone'
              func: zone_create
              params: [name, fabric_wwn, vsan_wwn, wwn_members, port_members, fwwn_members, fcid_members, device_alias_members]
            - name: modify
              description: 'Modify zone'
              func: zone_modify
              params: [zone_id, zone_name, wwn_members, fwwn_members, port_members, fcid_members, device_alias_members]
            - name: delete
              description: 'Delete zone'
              func: zone_delete
              params: [zone_id]
            - name: batch_create
              description: 'Batch create zones'
              func: zone_batch_create
              params: [is_active_zone, zones]
            - name: show_members
              description: 'Query zone members'
              func: zone_show_members
              params: [zone_id, type]
        - name: alias
          description: 'Alias query, create, modify, delete and member query'
          actions:
            - name: list
              description: 'Batch query aliases'
              func: alias_list
              params: [fabric_wwn, page_no, page_size]
            - name: create
              description: 'Create alias'
              func: alias_create
              params: [name, fabric_wwn, vsan_wwn, wwn_members, port_members, fwwn_members, fcid_members, device_alias_members]
            - name: modify
              description: 'Modify alias'
              func: alias_modify
              params: [alias_id, name, wwn_members, fwwn_members, port_members, fcid_members, device_alias_members]
            - name: delete
              description: 'Delete alias'
              func: alias_delete
              params: [alias_id]
            - name: show_members
              description: 'Query alias members'
              func: alias_show_members
              params: [alias_id, type]
    - name: gfs
      description: 'GFS (Global File System) related operations'
      actions:
      subtopics:
        - name: dataspace
          description: 'Omni-Dataverse dataspace and data service site query'
          actions:
            - name: list
              description: 'Batch query Omni-Dataverse'
              func: dataspace_list
              params: [name, id, raw_id, max_site_num, page_no, page_size]
            - name: show
              description: 'Query capacity statistics info of the specified Omni-Dataverse'
              func: dataspace_show
              params: [id, name]
            - name: site_list
              description: 'Query Omni-Dataverse data service sites'
              func: dataspace_site_list
              params: [raw_id, site_role, gfs_group_id, storage_name, storage_pool_name, account_name, page_no, page_size]
        - name: namespace
          description: 'Global namespace query, create, modify and delete'
          actions:
            - name: list
              description: 'Batch query global Namespace'
              func: namespace_list
              params: [name, gfs_group_name, gfs_group_id, gfs_type, sort_key, sort_dir, page_no, page_size]
            - name: show
              description: 'Query global Namespace details'
              func: namespace_show
              params: [id, name_locator]
            - name: create
              description: 'Create global Namespace'
              func: namespace_create
              params: [name, gfs_group_id, gfs_group_name, gfs_mode, single_write_switch, smart_share_members]
            - name: modify
              description: 'Modify the specified global Namespace'
              func: namespace_modify
