topics:
    - name: aiops
      description: 'AIOps 智能运维相关操作'
      actions:
      subtopics:
        - name: alarm
          description: '告警查询、确认、取消确认与清除'
          actions:
            - name: list
              description: '查询告警信息'
              func: alarm_list
              params: [alarm_id, severity, mo_dn, alarm_group_id, dc_id, product_name, alarm_name, occur_utc_start, occur_utc_end, fields, page_no, page_size, cleared, size, iterator, include_history]
            - name: ack
              description: '确认告警'
              func: alarm_ack
              params: [csns]
            - name: unack
              description: '取消确认告警'
              func: alarm_unack
              params: [csns]
            - name: clear
              description: '清除告警'
              func: alarm_clear
              params: [csns]
        - name: diagnose_task
          description: '智能性能诊断任务的创建与状态查询'
          actions:
            - name: create
              description: '创建智能分析任务'
              func: diagnose_task_create
              params: [object_ids, object_type, begin_time, end_time, analysis_types]
            - name: status
              description: '查询性能诊断任务状态'
              func: diagnose_task_status
              params: [task_id]
        - name: performance
          description: '历史性能数据查询、监控指标查询与性能文件收集'
          actions:
            - name: create_collect_task
              description: '创建性能文件收集任务'
              func: performance_create_collect_task
              params: [begin_time, end_time, object_type_id, object_ids, indicator_ids]
            - name: download_collect_result
              description: '下载性能文件'
              func: performance_download_collect_result
              params: [task_id, save_to]
            - name: query
              description: '查询历史性能数据'
              func: performance_query
              params: [obj_type_id, indicator_ids, obj_ids, obj_type, indicators, ext_dimensions, interval, range, begin_time, end_time]
            - name: show_indicators
              description: '显示监控指标详细信息'
              func: performance_show_indicators
              params: [indicators]
            - name: list_indicators
              description: '列出监控对象类型支持的监控指标'
              func: performance_list_indicators
              params: [obj_type_id]
            - name: list_object_types
              description: '获取所有监控对象类型'
              func: performance_list_object_types
              params: [filter]
        - name: check_result
          description: '检查策略异常检查结果的列表与详情查询'
          actions:
            - name: list
              description: '查询检查策略异常检查结果列表'
              func: check_result_list
              params: [object_name, level, object_ids, object_native_id, object_type, policy_id, policy_name, policy_types, cause, alarm_type, first_occur_time, last_occur_time, page_no, page_size, sort_key, sort_dir]
            - name: show
              description: '查询检查策略异常检查结果详情'
              func: check_result_show
              params: [check_result_id]
        - name: check_policy
          description: '检查策略的查询、执行、启用、禁用与删除'
          actions:
            - name: list
              description: '查询检查策略列表'
              func: check_policy_list
              params: [policy_name, exact_query, status, policy_type, policy_source, alarm_type, object_type, page_no, page_size, sort_key, sort_dir, administrative_status, policy_category, object_category]
            - name: execute
              description: '执行检查策略'
              func: check_policy_execute
              params: [policy_id]
            - name: enable
              description: '启用检查策略'
              func: check_policy_enable
              params: [policy_id]
            - name: disable
              description: '禁用检查策略'
              func: check_policy_disable
              params: [policy_id]
            - name: delete
              description: '删除检查策略'
              func: check_policy_delete
              params: [policy_id]
        - name: topology
          description: 'SAN 路径、LUN、虚拟机及拓扑图库信息查询'
          actions:
            - name: query_san_path
              description: '查询 SAN 路径拓扑结构'
              func: topology_query_san_path
              params: [entry_objects, san_type]
            - name: query_luns
              description: '查询拓扑图 LUN 列表'
              func: topology_query_luns
              params: [entry_objects, storage_pool_id, lun_name, san_type, page_size, page_no]
            - name: query_vms
              description: '查询拓扑图虚拟机和虚拟磁盘列表，或查询 BMS 下物理磁盘列表'
              func: topology_query_vms
              params: [entry_objects, host_id, vm_name, page_size, page_no]
            - name: query_graph_path
              description: '查询拓扑图库信息'
              func: topology_query_graph_path
              params: [entry_res_type, entry_res_id, type, filter]
        - name: health
          description: '对象健康度、健康得分与扣分详情查询'
          actions:
            - name: query_data
              description: '查询健康度相关数据'
              func: health_query_data
              params: [type, object_id, begin_time, end_time, object_type, indicator]
            - name: show_score
              description: '查询对象健康度'
              func: health_show_score
              params: [object_type, object_name, object_ids, page_no, page_size, sort_key, sort_dir]
            - name: show_detail
              description: '查询健康维度的扣分详情'
              func: health_show_detail
              params: [object_id, object_type, health_dimension]
    - name: backup
      description: '数据备份管理 (Backup) 相关操作'
      actions:
      subtopics:
        - name: cluster
          description: '备份集群列表、容量与租户配额查询'
          actions:
            - name: list
              description: '查询备份集群列表'
              func: cluster_list
              params: [page_no, page_size]
            - name: capacity
              description: '查询备份集群容量'
              func: cluster_capacity
              params: [cluster_id]
            - name: quota
              description: '查询备份集群租户配额列表'
              func: cluster_quota
              params: [cluster_id, page_no, page_size]
    - name: fcswitch
      description: 'FC Switch (光纤交换机) 相关操作'
      actions:
          - name: list
            description: '批量查询交换机'
            func: list
            params: [name, page_no, page_size]
          - name: sync
            description: '同步指定交换机'
            func: sync
            params: [switch_id]
      subtopics:
        - name: port
          description: 'FC 交换机端口查询'
          actions:
            - name: list
              description: '批量查询交换机端口'
              func: port_list
              params: [switch_id, port_name, page_no, page_size]
        - name: controller
          description: 'FC 交换机控制处理器查询'
          actions:
            - name: list
              description: '批量查询交换机控制处理器'
              func: controller_list
              params: [switch_id, page_no, page_size]
        - name: fabric
          description: '光纤网络查询与配置文件备份'
          actions:
            - name: list
              description: '批量查询光纤网络'
              func: fabric_list
              params: [name, page_no, page_size]
            - name: show_ports
              description: '查询指定光纤网络的端口列表'
              func: fabric_show_ports
              params: [fabric_id, page_no, page_size]
            - name: backup
              description: '执行光纤网络配置文件备份'
              func: fabric_backup
              params: [fabric_id, backup_server_id, backup_type]
        - name: vsan
          description: 'VSAN 列表查询'
          actions:
            - name: list
              description: '查询 VSAN 列表'
              func: vsan_list
              params: [page_no, page_size]
        - name: zone
          description: 'zone 的查询、创建、修改、删除与成员查询'
          actions:
            - name: list
              description: '批量查询 zone'
              func: zone_list
              params: [zone_name, page_no, page_size]
            - name: create
              description: '创建 zone'
              func: zone_create
              params: [name, fabric_wwn, vsan_wwn, wwn_members, port_members, fwwn_members, fcid_members, device_alias_members]
            - name: modify
              description: '修改 zone'
              func: zone_modify
              params: [zone_id, zone_name, wwn_members, fwwn_members, port_members, fcid_members, device_alias_members]
            - name: delete
              description: '删除 zone'
              func: zone_delete
              params: [zone_id]
            - name: batch_create
              description: '批量创建 zone'
              func: zone_batch_create
              params: [is_active_zone, zones]
            - name: show_members
              description: '查询 zone 的成员'
              func: zone_show_members
              params: [zone_id, type]
        - name: alias
          description: '别名的查询、创建、修改、删除与成员查询'
          actions:
            - name: list
              description: '批量查询别名'
              func: alias_list
              params: [fabric_wwn, page_no, page_size]
            - name: create
              description: '创建别名'
              func: alias_create
              params: [name, fabric_wwn, vsan_wwn, wwn_members, port_members, fwwn_members, fcid_members, device_alias_members]
            - name: modify
              description: '修改别名'
              func: alias_modify
              params: [alias_id, name, wwn_members, fwwn_members, port_members, fcid_members, device_alias_members]
            - name: delete
              description: '删除别名'
              func: alias_delete
              params: [alias_id]
            - name: show_members
              description: '查询别名的成员'
              func: alias_show_members
              params: [alias_id, type]
    - name: gfs
      description: 'GFS (Global File System) 相关操作'
      actions:
      subtopics:
        - name: dataspace
          description: 'Omni-Dataverse 数据空间与数据服务站点查询'
          actions:
            - name: list
              description: '批量查询 Omni-Dataverse'
              func: dataspace_list
              params: [name, id, raw_id, max_site_num, page_no, page_size]
            - name: show
              description: '查询指定 Omni-Dataverse 的容量统计信息'
              func: dataspace_show
              params: [id, name]
            - name: site_list
              description: '查询 Omni-Dataverse 数据服务站点'
              func: dataspace_site_list
              params: [raw_id, site_role, gfs_group_id, storage_name, storage_pool_name, account_name, page_no, page_size]
        - name: namespace
          description: '全局命名空间的查询、创建、修改与删除'
          actions:
            - name: list
              description: '批量查询全局命名空间'
              func: namespace_list
              params: [name, gfs_group_name, gfs_group_id, gfs_type, sort_key, sort_dir, page_no, page_size]
            - name: show
              description: '查询全局命名空间详情'
              func: namespace_show
              params: [id, name_locator]
            - name: create
              description: '创建全局命名空间'
              func: namespace_create
              params: [name, gfs_group_id, gfs_group_name, gfs_mode, single_write_switch, smart_share_members]
            - name: modify
              description: '修改指定全局命名空间'
              func: namespace_modify
              params: [id, name_locator, smart_share_members]
            - name: delete
              description: '删除指定的全局命名空间'
              func: namespace_delete
              params: [id, name_locator, is_delete_child]
        - name: migration_task
          description: 'Omni-Dataverse 数据迁移任务的创建、查询、修改、启停与删除'
          actions:
            - name: list
              description: '批量查询 Omni-Dataverse 数据迁移任务'
              func: migration_task_list
              params: [gfs_id, task_name, task_id, target_storage_name, namespace_name, namespace_id, namespace_raw_id, local_path, status, task_mode, execute_mode, page_no, page_size, sort_dir, sort_key]
            - name: show
              description: '查询 Omni-Dataverse 数据迁移任务详情'
              func: migration_task_show
              params: [id]
            - name: create
              description: '创建 Omni-Dataverse 数据迁移任务'
              func: migration_task_create
              params: [gfs_id, task_mode, start_mode, max_bandwidth, target_namespace_id, task_name, execute_mode, execute_time, execute_time_unit, start_time, period_start_day, period_end_day, period_time, period_max_bandwidth, local_path, src_namespace_ids, atime_operator, atime, atime_unit, mtime_operator, mtime, mtime_unit, ctime_operator, ctime, ctime_unit, crtime_operator, crtime, crtime_unit, name_operator, name_filter, size_operator, file_size, tag, file_paths, authentication_type, user_operator, user_name, group_operator, group_name, files_filter]
            - name: modify
              description: '修改 Omni-Dataverse 数据迁移任务'
              func: migration_task_modify
              params: [id, task_name, start_mode, start_time, execute_time, execute_time_unit, max_bandwidth, period_start_day, period_end_day, period_time, period_max_bandwidth]
            - name: delete
              description: '批量删除 Omni-Dataverse 数据迁移任务'
              func: migration_task_delete
              params: [ids]
            - name: operate
              description: '批量暂停或者启动 Omni-Dataverse 数据迁移任务'
              func: migration_task_operate
              params: [ids, operate_type]
    - name: integrate
      description: '三方系统集成 (Integrate) 相关操作'
      actions:
      subtopics:
        - name: cmdb
          description: 'CMDB 系统、主机、应用查询及按启动器关联主机'
          actions:
            - name: system_list
              description: '查询CMDB系统列表。'
              func: cmdb_system_list
              params: [name, page_no, page_size]
            - name: host_list
              description: '查询CMDB系统中的主机列表。'
              func: cmdb_host_list
              params: [system_id, name, ip, page_no, page_size]
            - name: host_show
              description: '查询指定CMDB主机详情。'
              func: cmdb_host_show
              params: [cmdb_host_id]
            - name: app_list
              description: '查询CMDB系统中的应用列表。'
              func: cmdb_app_list
              params: [system_id, name, page_no, page_size]
            - name: host_query_by_initiators
              description: '根据启动器列表查询CMDB主机列表。'
              func: cmdb_host_query_by_initiators
              params: [initiators]
    - name: ipswitch
      description: 'IP 交换机 (IPSwitch) 管理相关操作'
      actions:
          - name: list
            description: '查询以太网交换机列表信息'
            func: list
            params: [name, page_no, page_size]
      subtopics:
        - name: frame
          description: 'IP 交换机机框查询'
          actions:
            - name: list
              description: '查询 IP 交换机机框列表信息'
              func: frame_list
              params: [ipswitch_id, page_no, page_size]
        - name: board
          description: 'IP 交换机单板查询'
          actions:
            - name: list
              description: '查询 IP 交换机单板列表信息'
              func: board_list
              params: [ipswitch_id, page_no, page_size]
        - name: subcard
          description: 'IP 交换机子卡查询'
          actions:
            - name: list
              description: '查询 IP 交换机子卡列表信息'
              func: subcard_list
              params: [ipswitch_id, page_no, page_size]
        - name: power
          description: 'IP 交换机电源查询'
          actions:
            - name: list
              description: '查询 IP 交换机电源列表信息'
              func: power_list
              params: [ipswitch_id, page_no, page_size]
        - name: fan
          description: 'IP 交换机风扇查询'
          actions:
            - name: list
              description: '查询 IP 交换机风扇列表信息'
              func: fan_list
              params: [ipswitch_id, page_no, page_size]
        - name: port
          description: 'IP 交换机端口查询'
          actions:
            - name: list
              description: '查询 IP 交换机端口列表信息'
              func: port_list
              params: [ipswitch_id, page_no, page_size]
    - name: kube
      description: 'Kubernetes 相关操作'
      actions:
      subtopics:
        - name: cluster
          description: '容器集群列表查询'
          actions:
            - name: list
              description: '查询容器集群列表'
              func: cluster_list
              params: [id, name, version, ip_address, status, sync_status, platform_id, platform_name, sort_key, sort_dir, page_no, page_size]
        - name: node
          description: '容器节点列表查询'
          actions:
            - name: list
              description: '查询容器节点列表'
              func: node_list
              params: [id, name, cluster_id, pool_id, ip_address, ready_status, scheduling_status, pool_name, sort_key, sort_dir, page_no, page_size]
        - name: pod
          description: '容器组（Pod）列表查询'
          actions:
            - name: list
              description: '查询容器组列表'
              func: pod_list
              params: [id, name, workload_id, node_id, namespace_name, cluster_name, cluster_id, platform_id, platform_name, namespace_id, ip_address, node_name, running_status, controller, sort_key, sort_dir, page_no, page_size]
        - name: namespace
          description: '容器命名空间列表查询'
          actions:
            - name: list
              description: '查询容器命名空间列表'
              func: namespace_list
              params: [name, cluster_id, status, sort_key, sort_dir, page_no, page_size]
        - name: pvc
          description: '容器持久卷声明（PVC）列表查询'
          actions:
            - name: list
              description: '查询容器持久卷声明列表'
              func: pvc_list
              params: [name, namespace_name, cluster_name, cluster_id, platform_id, platform_name, namespace_id, status, access_mode, storage_class_name, sort_key, sort_dir, page_no, page_size]
        - name: pv
          description: '容器持久卷（PV）列表查询'
          actions:
            - name: list
              description: '查询容器持久卷列表'
              func: pv_list
              params: [id, name, cluster_name, cluster_id, platform_id, platform_name, status, access_mode, storage_class_name, sort_key, sort_dir, page_no, page_size]
    - name: nas
      description: 'NAS 相关操作'
      actions:
      subtopics:
        - name: account
          description: 'DataTurbo 管理员与 UNIX 认证用户、用户组管理'
          actions:
            - name: dataturbo_admin_list
              description: '批量查询 DataTurbo 管理员'
              func: account_dataturbo_admin_list
              params: [storage_id, vstore_id, vstore_name, zone_id, name, online_status, lock_status, account_state, sort_key, sort_dir, page_no, page_size]
            - name: unix_user_create
              description: '创建 UNIX 用户'
              func: account_unix_user_create
              params: [storage_id, name, vstore_raw_id, raw_id, description, primary_group_raw_id, primary_group_name, zone_id, status, secondary_group_name_list]
            - name: unix_user_add_group
              description: '添加 UNIX 用户附属组'
              func: account_unix_user_add_group
              params: [user_id, secondary_group_name_list]
            - name: unix_user_list
              description: '查询 UNIX 认证用户列表'
              func: account_unix_user_list
              params: [storage_id, storage_name, vstore_raw_id, vstore_name, name, primary_group_name, raw_id, zone_id, user_status, sort_key, sort_dir, page_no, page_size]
            - name: unix_user_show
              description: '查询 UNIX 认证用户详情'
              func: account_unix_user_show
              params: [id]
            - name: unix_user_remove_group
              description: '移除 UNIX 用户附属组'
              func: account_unix_user_remove_group
              params: [user_id, secondary_group_name_list]
            - name: unix_user_modify
              description: '修改 UNIX 用户'
              func: account_unix_user_modify
              params: [id, raw_id, description, primary_group_name, primary_group_raw_id, status_enable]
            - name: unix_user_batch_delete
              description: '删除 UNIX 用户'
              func: account_unix_user_batch_delete
              params: [ids]
            - name: unix_user_group_create
              description: '创建 UNIX 用户组'
              func: account_unix_user_group_create
              params: [storage_id, name, vstore_raw_id, raw_id, description, zone_id]
            - name: unix_user_group_list
              description: '查询 UNIX 认证用户组列表'
              func: account_unix_user_group_list
              params: [storage_id, storage_name, vstore_raw_id, vstore_name, name, raw_id, zone_id, sort_key, sort_dir, page_no, page_size]
            - name: unix_user_group_show
              description: '查询 UNIX 用户组详情'
              func: account_unix_user_group_show
              params: [id]
            - name: unix_user_group_modify
              description: '修改 UNIX 用户组'
              func: account_unix_user_group_modify
              params: [id, raw_id, description]
            - name: unix_user_group_batch_delete
              description: '删除 UNIX 用户组'
              func: account_unix_user_group_batch_delete
              params: [ids]
        - name: dtree
          description: 'Dtree 的查询、创建、修改与删除'
          actions:
            - name: list
              description: '查询 Dtree 列表'
              func: dtree_list
              params: [id_in_storage, name, device_name, storage_id, zone_id, manufacturer, tier_name, fs_name, fs_id, namespace_name, namespace_id, quota_switch, security_mode, nas_locking_policy, sort_key, sort_dir, page_no, page_size, dc_id, dc_name]
            - name: show
              description: '查询指定 Dtree 详情。'
              func: dtree_show
              params: [dtree_id]
            - name: create
              description: '创建并共享 Dtree'
              func: dtree_create
              params: [storage_id, create_dtrees_param, fs_id, namespace_id, zone_id, parent_dir, quota_switch, security_mode, nas_locking_policy, create_nfs_share_param, create_cifs_share_param, dataturbo_share, create_worm_param, unix_permissions, task_remarks]
            - name: delete
              description: '批量删除 Dtree。'
              func: dtree_delete
              params: [dtree_ids, task_remarks]
            - name: modify
              description: '修改指定 Dtree'
              func: dtree_modify
              params: [dtree_id, name, quota_switch, security_mode, nas_locking_policy, unix_permissions, task_remarks]
        - name: nfs_share
          description: 'NFS 共享的增删改查与客户端访问列表'
          actions:
            - name: list
