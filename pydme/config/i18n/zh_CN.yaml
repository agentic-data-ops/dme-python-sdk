        detail: |
          撤销审核待办项
          
          撤销对指定待办项的审核。
        parameters:
          client: 'DME API 客户端'
          item_id: '待办项 ID（必选）'
        outputs: '撤销结果'
      todo_task_close:
        description: '关闭待办任务'
        detail: |
          关闭待办任务
          
          关闭指定的待办项，需要提供关闭原因。
        parameters:
          client: 'DME API 客户端'
          item_id: '待办项 ID（必选）'
          reason: '关闭原因（必选，0-63 字符）'
        outputs: '关闭结果'
      task_show:
        description: '查询指定任务详情'
        detail: '查询指定任务详情'
        parameters:
          client: 'DME API 客户端'
          task_id: '任务 ID（必选，1~36 个字符）'
        outputs: |
          [{
              id: 任务ID (string),
              name_en: 任务英文名称 (string),
              name_cn: 任务中文名称 (string),
              description: 任务描述 (string, 可空),
              parent_id: 父任务ID (string),
              seq_no: 任务序号 (integer),
              status: 任务状态 (integer)。可选值：1 (初始状态), 2 (执行中), 3 (成功), 4 (部分成功), 5 (失败), 6 (超时), 7 (告警),
              progress: 任务进度 (integer),
              owner_name: 创建任务用户名称 (string, 可空),
              owner_id: 创建任务用户ID (string, 可空),
              create_time: 任务创建时间 (integer, UTC毫秒数),
