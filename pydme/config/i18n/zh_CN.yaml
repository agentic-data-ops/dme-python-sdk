                                    remote_lun_id: 远端 LUN 的 ID（必填），1~32 个字符，正则 ^[a-fA-F0-9]+$
                            },...]
            },...]
        outputs: |
          {
              task_id: 任务ID (string, 1~64个字符),
          }
