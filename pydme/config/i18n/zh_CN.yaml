              name: 名称 (string),
              description: 描述 (string),
              group_id: 组ID (string),
              service_type: 服务类型 (string),
              status: 状态 (string),
              creator_name: 创建人 (string),
              create_time: 创建时间 (string),
              task_id: 任务ID (string),
              start_time: 开始时间 (string),
              end_time: 结束时间 (string),
              close_reason: 关闭原因 (string),
              suggestion: 审批意见 (string),
          }
      todo_task_execute:
        description: '执行待办任务'
