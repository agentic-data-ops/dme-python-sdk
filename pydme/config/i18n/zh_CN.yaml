          port_group_name: '端口组名称 (可选, 0~256个字符, 支持模糊搜索; 与port_group_id/port_group_raw_id不支持同时下发)'
          sort_key: '排序字段 (可选)。可选值：raw_id, storage_host_group_raw_id, lun_group_raw_id, port_group_raw_id'
