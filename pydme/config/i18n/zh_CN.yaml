                            alarm_threshold: 告警阈值% (可选, 0~100),
                            resume_threshold: 恢复阈值% (可选, 0~100),
                            storage_divice_id: 所属存储设备id (可选),
                            name: QoS名称 (可选),
                            description: 描述 (可选),
                            iotype: 策略类型 (可选)。可选值：2 (总上限), 3 (读写上限),
                            vstore_id: 所属租户id (可选),
                            vstore_name: 所属租户名称 (可选),
                            global_flag: 是否全局 (可选),
                    }
                 }
