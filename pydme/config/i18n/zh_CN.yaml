                    show_snapshot_enabled: 是否开启显示Snapshot的功能 (可选),
                    user_and_user_group_info: 用户和用户组列表 (可选)。参数格式如下：[{
                            user_or_user_group_id_in_storage: 用户或用户组在存储上的id (可选, 1~64字符, 变更时必填),
                            user_or_user_group_name: 用户名或用户组名 (可选, 1~255字符; 用户组名称加前缀@),
