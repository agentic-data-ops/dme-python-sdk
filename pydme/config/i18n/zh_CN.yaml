      vsan_list:
        description: '查询 VSAN 列表'
        detail: '查询 VSAN 列表'
        parameters:
          client: 'DME API 客户端'
          page_no: '分页查询的页码，默认 1'
          page_size: '每页数量，1~1000，默认 20'
        outputs: |
          {
              total: 总数量 (int),
              vsans: VSAN 列表 (List),
